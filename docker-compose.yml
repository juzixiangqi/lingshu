name: lingshu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lingshu
      POSTGRES_PASSWORD: lingshu
      POSTGRES_DB: lingshu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingshu -d lingshu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO 官方镜像已从 Docker Hub 下架（实测该 tag pull 返回 not found），
    # 但本地已有缓存镜像，可直接运行；新机器需从内网镜像仓库或离线 tar 导入。
    # 对象存储只服务于导入导出，放入 storage profile，默认不启动。
    # 需要时：docker compose --profile storage up -d
    profiles: ["storage"]
    image: minio/minio:RELEASE.2024-04-28T17-53-50Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
