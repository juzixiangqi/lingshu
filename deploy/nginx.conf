server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 前端走同源 /api，后端地址由容器网络解析，不需要重新构建前端
  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
